apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio
  namespace: public
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: portfolio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portfolio
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: portfolio
      containers:
        - name: nginx
          # Chainguard's Wolfi image: no shell, no package manager, rebuilt
          # continuously, signed. Pinned by digest because the public registry
          # exposes only the "latest" tag.
          image: cgr.dev/chainguard/nginx@sha256:9aa6c46648f17b2835d009fd4338b38591b2396670a07270ee19b532f83dbbb5
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
            - name: nginx-tmp
              # Must be the tmp directory itself, not /var/lib/nginx: an emptyDir
              # there would hide the image's parent directory.
              mountPath: /var/lib/nginx/tmp
            - name: run
              mountPath: /run
      volumes:
        - name: content
          configMap:
            name: portfolio
            items:
              - key: index.html
                path: index.html
              - key: icon.svg
                path: icon.svg
        - name: config
          configMap:
            name: portfolio
            items:
              - key: default.conf
                path: default.conf
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: nginx-tmp
          # Wolfi's nginx puts its temp paths under /var/lib/nginx/tmp, so the
          # read-only root filesystem needs this writable.
          emptyDir: {}
        - name: run
          # The image's nginx.conf writes its pid to /run/nginx.pid.
          emptyDir: {}
