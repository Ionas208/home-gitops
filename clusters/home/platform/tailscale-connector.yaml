apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-connector
  namespace: argocd
  annotations:
    # After the operator, because the Connector CRD comes from its chart.
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/Ionas208/home-gitops.git
    targetRevision: main
    path: platform/tailscale-connector
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
