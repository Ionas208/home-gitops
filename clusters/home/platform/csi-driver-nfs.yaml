apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: csi-driver-nfs
  namespace: argocd
  annotations:
    # Storage classes must exist before any workload claims a volume.
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  sources:
    - repoURL: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
      chart: csi-driver-nfs
      targetRevision: "4.13.6"
      helm:
        releaseName: csi-driver-nfs
        valueFiles:
          - $values/platform/csi-driver-nfs/values.yaml
    - repoURL: https://github.com/Ionas208/home-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: csi-nfs
  syncPolicy:
    # The node plugin mounts host paths, uses hostNetwork, and needs to mount
    # filesystems. Talos enforces baseline PodSecurity cluster-wide.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
