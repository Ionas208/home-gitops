apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "92.16.1"
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/platform/observability/prometheus/values.yaml
    - repoURL: https://github.com/Ionas208/home-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    # node-exporter needs hostNetwork and hostPath. Talos enforces baseline
    # PodSecurity cluster-wide, so this namespace has to opt out.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The Prometheus operator CRDs are large.
      - ServerSideApply=true
