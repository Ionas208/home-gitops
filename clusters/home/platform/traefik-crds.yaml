apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://github.com/traefik/traefik-helm-chart
    targetRevision: v42.1.3
    path: traefik/crds
    directory:
      # Skip the traefik.io Hub CRDs; only the open-source ones are needed.
      include: 'traefik.io_*.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - Prune=false
