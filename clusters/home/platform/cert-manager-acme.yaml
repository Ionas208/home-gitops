apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-acme
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: https://github.com/Ionas208/home-gitops.git
    targetRevision: main
    path: platform/cert-manager/acme
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
