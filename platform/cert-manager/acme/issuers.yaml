# DNS-01 only: no inbound connection is needed and no A record has to exist,
# which is what makes an internal-only wildcard possible.
#
# Both issuers exist permanently. Only the Certificate's issuerRef decides
# which one is used, so switching is a one-line change.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    # Only used for expiry notices; Let's Encrypt never emails anything else.
    email: 10jonas101@gmail.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          cloudflare:
            # ClusterIssuer solvers read Secrets from the cert-manager
            # namespace, which is where the ExternalSecret writes this one.
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: 10jonas101@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
