# Source for platform/observability/config/50-snmp-exporter.yaml.
#
# Regenerate snmp.yml with the upstream generator (no Docker on the workstation,
# so the rendered config is maintained by hand against this schematic):
#
#   docker run --rm -v "$PWD/platform/observability/snmp:/opt" \
#     prom/snmp-exporter:v0.31.0 generate
#
# The generator needs mibs/NAS.mib (QTS-MIB v2.0, downloaded from QTS) and
# resolves the SNMPv2 base MIBs from its own image.
auths:
  qnap_v3:
    version: 3
    security_level: authPriv
    username: observability
    auth_protocol: MD5
    password: ${QNAP_SNMP_AUTH_PASSWORD}
    priv_protocol: DES
    priv_password: ${QNAP_SNMP_PRIV_PASSWORD}

modules:
  qnap:
    walk:
      # QTS-MIB storage subtree: diskTableEntry, raidTableEntry, volumeTableEntry
      - 1.3.6.1.4.1.55062.1.10.2.1
      - 1.3.6.1.4.1.55062.1.10.5.1
      - 1.3.6.1.4.1.55062.1.10.9.1
    get:
      - 1.3.6.1.2.1.1.1.0
      - 1.3.6.1.2.1.1.3.0
      - 1.3.6.1.2.1.1.5.0
    metrics:
      - name: sysDescr
        oid: 1.3.6.1.2.1.1.1
        type: DisplayString
        help: System description
      - name: sysName
        oid: 1.3.6.1.2.1.1.5
        type: DisplayString
        help: System name
      - name: sysUpTime
        oid: 1.3.6.1.2.1.1.3
        type: gauge
        help: Time since the system was last re-initialized, in ticks

      # diskTableEntry
      - name: diskStatus
        oid: 1.3.6.1.4.1.55062.1.10.2.1.7
        type: DisplayString
        help: Disk status
        indexes:
          - labelname: diskIndex
            type: gauge
      - name: diskTemperature
        oid: 1.3.6.1.4.1.55062.1.10.2.1.8
        type: gauge
        help: Disk temperature
        indexes:
          - labelname: diskIndex
            type: gauge
      - name: diskCapacity
        oid: 1.3.6.1.4.1.55062.1.10.2.1.9
        type: gauge
        help: Disk capacity in bytes
        indexes:
          - labelname: diskIndex
            type: gauge
      - name: diskModel
        oid: 1.3.6.1.4.1.55062.1.10.2.1.4
        type: DisplayString
        help: Disk model
        indexes:
          - labelname: diskIndex
            type: gauge
      - name: diskSerialNumber
        oid: 1.3.6.1.4.1.55062.1.10.2.1.5
        type: DisplayString
        help: Disk serial number
        indexes:
          - labelname: diskIndex
            type: gauge

      # raidTableEntry
      - name: raidStatus
        oid: 1.3.6.1.4.1.55062.1.10.5.1.4
        type: DisplayString
        help: RAID status
        indexes:
          - labelname: raidIndex
            type: gauge
      - name: raidLevel
        oid: 1.3.6.1.4.1.55062.1.10.5.1.7
        type: gauge
        help: RAID level
        indexes:
          - labelname: raidIndex
            type: gauge
      - name: raidCapacity
        oid: 1.3.6.1.4.1.55062.1.10.5.1.5
        type: gauge
        help: RAID capacity in bytes
        indexes:
          - labelname: raidIndex
            type: gauge
      - name: raidName
        oid: 1.3.6.1.4.1.55062.1.10.5.1.3
        type: DisplayString
        help: RAID name
        indexes:
          - labelname: raidIndex
            type: gauge

      # volumeTableEntry
      - name: volumeStatus
        oid: 1.3.6.1.4.1.55062.1.10.9.1.5
        type: DisplayString
        help: Volume status
        indexes:
          - labelname: volumeIndex
            type: gauge
      - name: volumeCapacity
        oid: 1.3.6.1.4.1.55062.1.10.9.1.3
        type: gauge
        help: Volume capacity in bytes
        indexes:
          - labelname: volumeIndex
            type: gauge
      - name: volumeFreeSize
        oid: 1.3.6.1.4.1.55062.1.10.9.1.4
        type: gauge
        help: Volume free space in bytes
        indexes:
          - labelname: volumeIndex
            type: gauge
      - name: volumeName
        oid: 1.3.6.1.4.1.55062.1.10.9.1.8
        type: DisplayString
        help: Volume name
        indexes:
          - labelname: volumeIndex
            type: gauge
    # Note: the generated snmp.yml carries no per-module auth. Prometheus selects
    # it with the `auth` parameter on the /snmp scrape.
