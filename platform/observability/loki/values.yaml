# Single-binary Loki on local-path. The microservices topology needs object
# storage and several nodes; neither exists here.
deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  limits_config:
    # Time-based retention is the only thing Loki enforces against disk use, so
    # the ingest limits below are what keep a log flood from filling local-path.
    retention_period: 168h
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    ingestion_rate_mb: 4
    ingestion_burst_size_mb: 8
    per_stream_rate_limit: 3MB
    per_stream_rate_limit_burst: 15MB
    max_streams_per_user: 5000
    max_global_streams_per_user: 5000
    max_query_series: 500

  compactor:
    retention_enabled: true
    delete_request_store: filesystem

  pattern_ingester:
    enabled: false

  ruler:
    enable_api: false

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi
  persistence:
    enabled: true
    storageClass: local-path
    size: 10Gi

# Only the single binary runs; the scalable-mode workloads must be scaled to 0.
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# No memcached and no nginx gateway on a single node.
chunksCache:
  enabled: false
resultsCache:
  enabled: false
gateway:
  enabled: false

lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false
