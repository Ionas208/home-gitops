# Every credential the observability stack needs. The ClusterSecretStore is
# cluster-scoped, so these work from the monitoring namespace unchanged.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        admin-user: admin
        admin-password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: GRAFANA_ADMIN_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-discord
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: alertmanager-discord
    creationPolicy: Owner
  data:
    - secretKey: webhook
      remoteRef:
        key: DISCORD_WEBHOOK_URL
---
# Full htpasswd line, e.g. alertmanager:$apr1$...
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-basic-auth
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: alertmanager-basic-auth
    creationPolicy: Owner
  data:
    - secretKey: users
      remoteRef:
        key: ALERTMANAGER_BASIC_AUTH
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qnap-snmp
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: qnap-snmp
    creationPolicy: Owner
  data:
    - secretKey: QNAP_SNMP_AUTH_PASSWORD
      remoteRef:
        key: QNAP_SNMP_AUTH_PASSWORD
    - secretKey: QNAP_SNMP_PRIV_PASSWORD
      remoteRef:
