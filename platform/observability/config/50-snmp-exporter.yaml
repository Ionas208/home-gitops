# SNMP exporter for the QNAP. Deployed as plain manifests rather than the Helm
# chart so the generated snmp.yml stays a readable, diffable file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: snmp-exporter-config
  namespace: monitoring
data:
  snmp.yml: |
    auths:
      qnap_v3:
        version: 3
        security_level: authPriv
        username: observability
        auth_protocol: MD5
        password: ${QNAP_SNMP_AUTH_PASSWORD}
        priv_protocol: DES
        priv_password: ${QNAP_SNMP_PRIV_PASSWORD}

    modules:
      qnap:
        walk:
          - 1.3.6.1.4.1.55062.1.10.2.1
          - 1.3.6.1.4.1.55062.1.10.5.1
          - 1.3.6.1.4.1.55062.1.10.9.1
        get:
          - 1.3.6.1.2.1.1.1.0
          - 1.3.6.1.2.1.1.3.0
          - 1.3.6.1.2.1.1.5.0
        metrics:
          - name: sysDescr
            oid: 1.3.6.1.2.1.1.1
            type: DisplayString
            help: System description
          - name: sysName
            oid: 1.3.6.1.2.1.1.5
            type: DisplayString
            help: System name
          - name: sysUpTime
            oid: 1.3.6.1.2.1.1.3
            type: gauge
            help: Time since the system was last re-initialized, in ticks
          - name: diskStatus
            oid: 1.3.6.1.4.1.55062.1.10.2.1.7
            type: DisplayString
            help: Disk status
            indexes:
              - labelname: diskIndex
                type: gauge
          - name: diskTemperature
            oid: 1.3.6.1.4.1.55062.1.10.2.1.8
            type: gauge
            help: Disk temperature
            indexes:
              - labelname: diskIndex
                type: gauge
          - name: diskCapacity
            oid: 1.3.6.1.4.1.55062.1.10.2.1.9
            type: gauge
            help: Disk capacity in bytes
            indexes:
              - labelname: diskIndex
                type: gauge
          - name: diskModel
            oid: 1.3.6.1.4.1.55062.1.10.2.1.4
            type: DisplayString
            help: Disk model
            indexes:
              - labelname: diskIndex
                type: gauge
          - name: diskSerialNumber
            oid: 1.3.6.1.4.1.55062.1.10.2.1.5
            type: DisplayString
            help: Disk serial number
            indexes:
              - labelname: diskIndex
                type: gauge
          - name: raidStatus
            oid: 1.3.6.1.4.1.55062.1.10.5.1.4
            type: DisplayString
            help: RAID status
            indexes:
              - labelname: raidIndex
                type: gauge
          - name: raidLevel
            oid: 1.3.6.1.4.1.55062.1.10.5.1.7
            type: gauge
            help: RAID level
            indexes:
              - labelname: raidIndex
                type: gauge
          - name: raidCapacity
            oid: 1.3.6.1.4.1.55062.1.10.5.1.5
            type: gauge
            help: RAID capacity in bytes
            indexes:
              - labelname: raidIndex
                type: gauge
          - name: raidName
            oid: 1.3.6.1.4.1.55062.1.10.5.1.3
            type: DisplayString
            help: RAID name
            indexes:
              - labelname: raidIndex
                type: gauge
          - name: volumeStatus
            oid: 1.3.6.1.4.1.55062.1.10.9.1.5
            type: DisplayString
            help: Volume status
            indexes:
              - labelname: volumeIndex
                type: gauge
          - name: volumeCapacity
            oid: 1.3.6.1.4.1.55062.1.10.9.1.3
            type: gauge
            help: Volume capacity in bytes
            indexes:
              - labelname: volumeIndex
                type: gauge
          - name: volumeFreeSize
            oid: 1.3.6.1.4.1.55062.1.10.9.1.4
            type: gauge
            help: Volume free space in bytes
            indexes:
              - labelname: volumeIndex
                type: gauge
          - name: volumeName
            oid: 1.3.6.1.4.1.55062.1.10.9.1.8
            type: DisplayString
            help: Volume name
            indexes:
              - labelname: volumeIndex
                type: gauge
    # Auth is selected at scrape time via the `auth` parameter, not inside a
    # module (snmp_exporter >= 0.23 format).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snmp-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: snmp-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: snmp-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: snmp-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: snmp-exporter
          image: quay.io/prometheus/snmp-exporter:v0.31.0
          args:
            - --config.file=/etc/snmp/snmp.yml
            # Resolve ${QNAP_SNMP_*_PASSWORD} from the environment so the
            # ConfigMap never contains credentials.
            - --config.expand-environment-variables
          envFrom:
            - secretRef:
                name: qnap-snmp
          ports:
            - name: http
              containerPort: 9115
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/snmp
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: snmp-exporter-config
---
apiVersion: v1
kind: Service
metadata:
  name: snmp-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: snmp-exporter
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: snmp-exporter
  ports:
    - name: http
      port: 9115
      targetPort: http
