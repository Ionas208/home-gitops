# Internal admin UIs. Both terminate TLS on the websecure listener with the
# wildcard certificate; nothing here is routed through Cloudflare.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: traefik
      namespace: traefik
      sectionName: websecure
  hostnames:
    - grafana.home.jonasseidl.com
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
---
# Alertmanager has no authentication of its own, and whoever can reach the UI can
# silence alerts. Basic auth via a Traefik middleware, credentials from BSM.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: alertmanager-basic-auth
  namespace: monitoring
spec:
  basicAuth:
    secret: alertmanager-basic-auth
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  parentRefs:
    - name: traefik
      namespace: traefik
      sectionName: websecure
  hostnames:
    - alertmanager.home.jonasseidl.com
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: alertmanager-basic-auth
      backendRefs:
        - name: kube-prometheus-stack-alertmanager
          port: 9093
