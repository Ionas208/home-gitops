apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale-oauth
  namespace: tailscale
  annotations:
    # Apply before the operator Deployment. The operator mounts this Secret, so
    # waiting for the Deployment to become healthy first would deadlock.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: tailscale-oauth
    creationPolicy: Owner
  data:
    # Key names are fixed by the operator: it reads these as mounted files.
    - secretKey: client_id
      remoteRef:
        key: TAILSCALE_OAUTH_CLIENT_ID
    - secretKey: client_secret
      remoteRef:
        key: TAILSCALE_OAUTH_CLIENT_SECRET
