apiVersion: v1
kind: ConfigMap
metadata:
  name: www
  namespace: public
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Work in progress</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center;
             font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { text-align: center; padding: 2rem; }
      h1 { font-size: clamp(1.5rem, 4vw, 2.5rem); margin: 0 0 .75rem; font-weight: 600; }
      p { margin: 0; opacity: .7; }
    </style>
    </head>
    <body>
    <main>
      <h1>Work in progress</h1>
      <p>This site is being rebuilt. Check back soon.</p>
    </main>
    </body>
    </html>
  default.conf: |
    server {
        listen 8080;
        server_name _;
        server_tokens off;

        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'" always;

        location / {
            try_files $uri $uri/ =404;
        }
    }
