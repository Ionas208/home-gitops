apiVersion: v1
kind: ConfigMap
metadata:
  name: lan-dns
  namespace: lan-dns
data:
  # Two server blocks on the same port: authoritative for the internal zone,
  # recursive forwarder for everything else. No blocklists, no ad-blocking.
  Corefile: |
    home.jonasseidl.com:53 {
        errors
        # No cache plugin: the file plugin serves from memory, and the cache
        # would cap the zone's TTL at its own maximum.
        file /etc/coredns/home.zone home.jonasseidl.com
    }

    # Clients query this service directly, so the router is no longer in their
    # resolution path. Forward its own namespace back to it.
    fritz.box:53 {
        errors
        cache 300
        forward . 192.168.178.1
    }

    .:53 {
        errors
        health :8080
        ready :8181
        cache 30
        loop
        reload
        # Public resolvers, not the FRITZ!Box: the router is out of the path,
        # and this keeps its own upstream setting irrelevant.
        forward . 1.1.1.1 9.9.9.9 {
            max_concurrent 1000
        }
    }
  home.zone: |
    $ORIGIN home.jonasseidl.com.
    $TTL 3600
    @ IN SOA ns.home.jonasseidl.com. hostmaster.home.jonasseidl.com. (
      2026102602 ; serial, bump to force a reload
      7200       ; refresh
      3600       ; retry
      1209600    ; expire
      300 )      ; negative TTL
    @  IN NS ns.home.jonasseidl.com.
    ns IN A  192.168.178.244
    @  IN A  192.168.178.243
    *  IN A  192.168.178.243
    proxmox IN A 192.168.178.249
