apiVersion: apps/v1
kind: Deployment
metadata:
  name: lan-dns
  namespace: lan-dns
spec:
  # Two replicas so a node drain does not take DNS down with it. MetalLB picks
  # a single node for the VIP, but any endpoint behind the Service can answer.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: lan-dns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lan-dns
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: lan-dns
      containers:
        - name: coredns
          image: coredns/coredns:1.14.7
          args:
            - -conf
            - /etc/coredns/Corefile
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: health
              containerPort: 8080
            - name: ready
              containerPort: 8181
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: ready
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              # No CPU limit: throttling a resolver causes DNS timeouts.
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              # Port 53 is privileged. The image runs as root, so this is the
              # only capability it needs.
              add:
                - NET_BIND_SERVICE
          volumeMounts:
            - name: config
              mountPath: /etc/coredns
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: lan-dns
