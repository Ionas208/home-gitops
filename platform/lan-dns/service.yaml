apiVersion: v1
kind: Service
metadata:
  name: lan-dns
  namespace: lan-dns
  annotations:
    metallb.io/loadBalancerIPs: 192.168.178.244
spec:
  type: LoadBalancer
  # Default Cluster policy: the VIP answers on any node and reaches whichever
  # replica is healthy. Client addresses are irrelevant for DNS.
  selector:
    app.kubernetes.io/name: lan-dns
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
