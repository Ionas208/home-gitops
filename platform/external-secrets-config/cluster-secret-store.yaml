# Cluster-scoped so one store can serve every namespace. Scoping to a single
# organization and project is what limits what a compromised cluster can read;
# the machine account's own permissions are a separate, wider boundary.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bitwarden
spec:
  provider:
    bitwardensecretsmanager:
      apiURL: https://api.bitwarden.com
      identityURL: https://identity.bitwarden.com
      bitwardenServerSDKURL: https://bitwarden-sdk-server.external-secrets.svc.cluster.local:9998
      organizationID: 9fa75d3a-8c13-4423-a404-b4ef00b54eea
      projectID: 0c92ea26-3d60-43a2-a4e4-b4ef00b583a3
      auth:
        secretRef:
          credentials:
            # Bootstrap Secret, created once by hand: External Secrets cannot
            # read its own credential out of Bitwarden.
            name: bitwarden-access-token
            namespace: external-secrets
            key: accessToken
      # Trust the SDK server's certificate. Cert-manager puts the issuing CA
      # in ca.crt, so this follows CA rotation automatically.
      caProvider:
        type: Secret
        name: bitwarden-tls-certs
        namespace: external-secrets
        key: ca.crt
