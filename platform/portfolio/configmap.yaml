apiVersion: v1
kind: ConfigMap
metadata:
  name: portfolio
  namespace: public
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Work in progress</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #06070a;
        --fg: #eef1f6;
        --accent: #8b9cff;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        background:
          radial-gradient(55rem 40rem at 50% 18%, rgba(139, 156, 255, .16), transparent 68%),
          radial-gradient(40rem 30rem at 50% 105%, rgba(139, 156, 255, .08), transparent 60%),
          var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      main {
        display: grid;
        justify-items: center;
        gap: clamp(1.25rem, 4vw, 2.5rem);
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 11vw, 6.5rem);
        line-height: 1;
        font-weight: 600;
        letter-spacing: -.02em;
        text-transform: uppercase;
        background: linear-gradient(180deg, #ffffff 10%, #8e9bb6 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: breathe 7s ease-in-out infinite;
      }
      .dots {
        display: flex;
        gap: clamp(.5rem, 1.6vw, .9rem);
      }
      .dots span {
        width: clamp(.45rem, 1.4vw, .8rem);
        aspect-ratio: 1;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 1.4rem rgba(139, 156, 255, .55);
        animation: pulse 1.5s ease-in-out infinite;
      }
      .dots span:nth-child(2) { animation-delay: .18s; }
      .dots span:nth-child(3) { animation-delay: .36s; }
      @keyframes pulse {
        0%, 100% { opacity: .16; transform: scale(.72); }
        50% { opacity: 1; transform: scale(1); }
      }
      @keyframes breathe {
        0%, 100% { opacity: .78; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        h1 { animation: none; opacity: 1; }
        .dots span { animation: none; opacity: .85; }
      }
    </style>
    </head>
    <body>
      <main>
        <h1>Work in progress</h1>
        <div class="dots" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
      </main>
    </body>
    </html>
  default.conf: |
    server {
        listen 8080;
        server_name _;
        server_tokens off;

        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'" always;

        location / {
            try_files $uri $uri/ =404;
        }
    }
