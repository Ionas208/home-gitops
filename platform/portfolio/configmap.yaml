apiVersion: v1
kind: ConfigMap
metadata:
  name: portfolio
  namespace: public
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Jonas Seidl — portfolio, currently under construction.">
    <meta name="robots" content="noindex">
    <title>Jonas Seidl</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f5f7;
        --fg: #14171c;
        --muted: #5c6572;
        --line: rgba(20, 23, 28, .1);
        --card: rgba(255, 255, 255, .72);
        --shadow: 0 24px 60px -30px rgba(20, 23, 28, .45);
        --accent: #3b5bdb;
        --accent-soft: rgba(59, 91, 219, .12);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0c10;
          --fg: #eef1f6;
          --muted: #98a2b1;
          --line: rgba(238, 241, 246, .1);
          --card: rgba(255, 255, 255, .035);
          --shadow: 0 24px 70px -30px rgba(0, 0, 0, .8);
          --accent: #9aabff;
          --accent-soft: rgba(154, 171, 255, .14);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 3rem 1.25rem;
        background:
          radial-gradient(55rem 38rem at 12% -12%, var(--accent-soft), transparent 62%),
          radial-gradient(45rem 32rem at 108% 112%, var(--accent-soft), transparent 58%),
          var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      main {
        width: min(34rem, 100%);
        padding: clamp(1.75rem, 5vw, 3rem);
        border: 1px solid var(--line);
        border-radius: 22px;
        background: var(--card);
        box-shadow: var(--shadow);
        backdrop-filter: blur(14px);
        animation: rise .6s cubic-bezier(.2, .8, .2, 1) both;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: .5rem;
        padding: .35rem .7rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        font-size: .7rem;
        letter-spacing: .1em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .dot {
        width: .42rem;
        height: .42rem;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 0 var(--accent-soft);
        animation: pulse 2.4s ease-out infinite;
      }
      h1 {
        margin: 1.15rem 0 .6rem;
        font-size: clamp(2rem, 6vw, 2.85rem);
        line-height: 1.05;
        letter-spacing: -.035em;
        font-weight: 640;
      }
      .lede {
        margin: 0;
        max-width: 28rem;
        font-size: clamp(1rem, 2.4vw, 1.1rem);
        line-height: 1.6;
        color: var(--muted);
      }
      .note {
        margin: 1.35rem 0 0;
        padding-top: 1.35rem;
        border-top: 1px solid var(--line);
        font-size: .9rem;
        line-height: 1.6;
        color: var(--muted);
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: .6rem;
        margin-top: 1.6rem;
      }
      .links a {
        display: inline-flex;
        align-items: center;
        gap: .45rem;
        padding: .55rem .9rem;
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--fg);
        font-size: .88rem;
        text-decoration: none;
        transition: background .18s ease, border-color .18s ease, transform .18s ease;
      }
      .links a:hover {
        background: var(--accent-soft);
        border-color: var(--accent);
        transform: translateY(-1px);
      }
      .links a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      footer {
        margin-top: 1.4rem;
        font-size: .78rem;
        color: var(--muted);
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes pulse {
        0% { box-shadow: 0 0 0 0 var(--accent-soft); }
        70% { box-shadow: 0 0 0 .45rem transparent; }
        100% { box-shadow: 0 0 0 0 transparent; }
      }
      @media (prefers-reduced-motion: reduce) {
        main { animation: none; }
        .dot { animation: none; }
        .links a { transition: none; }
      }
    </style>
    </head>
    <body>
      <main>
        <span class="status"><span class="dot" aria-hidden="true"></span>Under construction</span>
        <h1>Jonas Seidl</h1>
        <p class="lede">Portfolio, notes and experiments. The new site is on the workbench and will land here piece by piece.</p>
        <p class="note">Until then: the infrastructure behind this page is the project. Kubernetes, GitOps and a very small amount of YAML.</p>
        <div class="links">
          <a href="https://github.com/Ionas208" rel="me noopener">GitHub</a>
        </div>
        <footer>jonasseidl.com</footer>
      </main>
    </body>
    </html>
  default.conf: |
    server {
        listen 8080;
        server_name _;
        server_tokens off;

        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'" always;

        location / {
            try_files $uri $uri/ =404;
        }
    }
