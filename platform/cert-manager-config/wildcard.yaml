# Wildcard plus the bare apex. Lives in the traefik namespace because a
# Gateway can only reference Secrets from its own namespace without a
# ReferenceGrant, and the Gateway lives there.
#
# Validated on letsencrypt-staging first. Production has a 5-per-week duplicate
# limit for this name set, so the staging order is not a formality.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-home
  namespace: traefik
spec:
  secretName: wildcard-home-jonasseidl-com-tls
  dnsNames:
    - home.jonasseidl.com
    - "*.home.jonasseidl.com"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - server auth
    - digital signature
